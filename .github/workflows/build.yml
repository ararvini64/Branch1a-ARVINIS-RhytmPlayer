name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Enable AndroidX & Setup Gradle 8.2.1
      run: |
        # فعال‌سازی AndroidX
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        # نصب نسخه سازگار گریدل 8.2.1
        mkdir -p gradle/wrapper
        curl -sL https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        # ساخت فایل gradlew برای استفاده از نسخه 8.2.1
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.2.1
        chmod +x gradlew

    - name: Build APK with Gradle 8.2.1
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBNIS-Rhythm-Player-APK
        path: app/build/outputs/apk/debug/*.apk
