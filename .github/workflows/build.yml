name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Enable AndroidX & Patch AndroidManifest Theme
      run: |
        # 1. فعال‌سازی AndroidX
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # 2. ساخت آیکون‌های موقت برای جلوگیری از خطای AAPT
        mkdir -p app/src/main/res/mipmap-hdpi
        cat << 'EOF' > app/src/main/res/mipmap-hdpi/ic_launcher.png
        iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
        EOF
        cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        # 3. اصلاح تم ناخوانا در AndroidManifest.xml به تم استاندارد سیستم
        sed -i 's|android:style/Theme.Material.NoTitleBar|android:style/Theme.Material.Light.NoActionBar|g' app/src/main/AndroidManifest.xml
        sed -i 's|Theme.Material.NoTitleBar|Theme.Material.Light.NoActionBar|g' app/src/main/AndroidManifest.xml

        # 4. آماده‌سازی Gradle 8.2.1
        mkdir -p gradle/wrapper
        curl -sL https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.2.1
        chmod +x gradlew

    - name: Build APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBNIS-Rhythm-Player-APK
        path: app/build/outputs/apk/debug/*.apk
