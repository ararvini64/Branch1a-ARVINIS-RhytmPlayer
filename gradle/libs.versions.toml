[versions]
agp = "8.2.2"
kotlin = "1.9.22"
coreCtx = "1.12.0"
lifecycleRuntime = "2.7.0"
activityCompose = "1.8.2"
composeBom = "2023.08.00"
media3 = "1.2.1"
